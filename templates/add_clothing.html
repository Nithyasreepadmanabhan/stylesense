{% extends "layout.html" %}

{% block title %}Add Clothing Item{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="card-custom p-4 p-md-5">
                <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                    <div>
                        <h2 class="font-serif fw-bold mb-1">Add Clothing Item</h2>
                        <p class="text-muted small mb-0">Catalog a new piece into your personal digital closet</p>
                    </div>
                    <a href="{{ url_for('wardrobe') }}" class="btn btn-sm btn-outline-custom">
                        <i class="bi bi-arrow-left me-1"></i> Back
                    </a>
                </div>

                <form action="{{ url_for('add_clothing') }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label" for="item_name">Item Name *</label>
                        <input type="text" class="form-control" id="item_name" name="item_name" placeholder="e.g. White Oversized Linen Shirt" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label" for="category">Category *</label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="" disabled selected>Select Category</option>
                                <option value="Top">Top</option>
                                <option value="Bottom">Bottom</option>
                                <option value="Dress">Dress</option>
                                <option value="Jacket">Jacket</option>
                                <option value="Shoes">Shoes</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Bag">Bag</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="color">Primary Color *</label>
                            <select class="form-select" id="color" name="color" required>
                                <option value="" disabled selected>Select Color</option>
                                <option value="White">White</option>
                                <option value="Black">Black</option>
                                <option value="Blue">Blue</option>
                                <option value="Beige">Beige</option>
                                <option value="Brown">Brown</option>
                                <option value="Green">Green</option>
                                <option value="Red">Red</option>
                                <option value="Pink">Pink</option>
                                <option value="Yellow">Yellow</option>
                                <option value="Purple">Purple</option>
                                <option value="Silver">Silver</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label" for="pattern">Pattern</label>
                            <select class="form-select" id="pattern" name="pattern">
                                <option value="Solid" selected>Solid</option>
                                <option value="Striped">Striped</option>
                                <option value="Plaid">Plaid / Checked</option>
                                <option value="Floral">Floral</option>
                                <option value="Graphic">Graphic</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="season">Season / Weather</label>
                            <select class="form-select" id="season" name="season">
                                <option value="Hot">Hot / Summer</option>
                                <option value="Normal" selected>Normal / All Season</option>
                                <option value="Cold">Cold / Winter</option>
                                <option value="Rainy">Rainy</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="occasion">Occasion</label>
                            <select class="form-select" id="occasion" name="occasion">
                                <option value="College">College</option>
                                <option value="Casual" selected>Casual</option>
                                <option value="Date">Date</option>
                                <option value="Party">Party</option>
                                <option value="Interview">Interview</option>
                                <option value="Formal">Formal</option>
                                <option value="Wedding">Wedding</option>
                                <option value="Travel">Travel</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="imageInput">Upload Image</label>
                        <input type="file" class="form-control" id="imageInput" name="image" accept="image/*">
                        <div class="form-text">Supported formats: JPG, PNG, WEBP, GIF. Default image used if empty.</div>
                        <div class="mt-3 text-center">
                            <img id="imagePreview" src="#" alt="Preview" class="img-thumbnail rounded-3 shadow-sm" style="display: none; max-height: 180px;">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="{{ url_for('wardrobe') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary-custom px-4">
                            <i class="bi bi-check-lg me-1"></i> Save Item
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
