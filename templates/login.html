{% extends "layout.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card-custom p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="bg-light d-inline-flex p-3 rounded-circle text-primary mb-3">
                        <i class="bi bi-person-heart display-6 text-danger"></i>
                    </div>
                    <h2 class="font-serif fw-bold">Welcome Back</h2>
                    <p class="text-muted small">Log in to manage your wardrobe & style recommendations</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3">
                        Log In to StyleSense <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <p class="small text-muted mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Register here</a></p>
                </div>
            </div>
            
            <div class="card mt-3 bg-light border-0 p-3 text-center small text-muted">
                💡 <strong>Demo Credentials:</strong> <br>
                Email: <code>sophia@example.com</code> | Password: <code>password123</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
