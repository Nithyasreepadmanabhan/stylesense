{% extends "layout.html" %}

{% block title %}Edit Clothing Item{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="card-custom p-4 p-md-5">
                <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                    <div>
                        <h2 class="font-serif fw-bold mb-1">Edit Item</h2>
                        <p class="text-muted small mb-0">Update item details for "{{ item.item_name }}"</p>
                    </div>
                    <a href="{{ url_for('wardrobe') }}" class="btn btn-sm btn-outline-custom">
                        <i class="bi bi-arrow-left me-1"></i> Back
                    </a>
                </div>

                <form action="{{ url_for('edit_clothing', item_id=item.id) }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label" for="item_name">Item Name *</label>
                        <input type="text" class="form-control" id="item_name" name="item_name" value="{{ item.item_name }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label" for="category">Category *</label>
                            <select class="form-select" id="category" name="category" required>
                                {% for cat in ['Top', 'Bottom', 'Dress', 'Jacket', 'Shoes', 'Accessories', 'Bag'] %}
                                <option value="{{ cat }}" {% if item.category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="color">Primary Color *</label>
                            <select class="form-select" id="color" name="color" required>
                                {% for col in ['White', 'Black', 'Blue', 'Beige', 'Brown', 'Green', 'Red', 'Pink', 'Yellow', 'Purple', 'Silver'] %}
                                <option value="{{ col }}" {% if item.color == col %}selected{% endif %}>{{ col }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label" for="pattern">Pattern</label>
                            <select class="form-select" id="pattern" name="pattern">
                                {% for pat in ['Solid', 'Striped', 'Plaid', 'Floral', 'Graphic'] %}
                                <option value="{{ pat }}" {% if item.pattern == pat %}selected{% endif %}>{{ pat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="season">Season / Weather</label>
                            <select class="form-select" id="season" name="season">
                                {% for sea in ['Hot', 'Normal', 'Cold', 'Rainy'] %}
                                <option value="{{ sea }}" {% if item.season == sea %}selected{% endif %}>{{ sea }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="occasion">Occasion</label>
                            <select class="form-select" id="occasion" name="occasion">
                                {% for occ in ['College', 'Casual', 'Date', 'Party', 'Interview', 'Formal', 'Wedding', 'Travel'] %}
                                <option value="{{ occ }}" {% if item.occasion == occ %}selected{% endif %}>{{ occ }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="imageInput">Change Image (Optional)</label>
                        <input type="file" class="form-control" id="imageInput" name="image" accept="image/*">
                        <div class="mt-3 text-center">
                            <img id="imagePreview" src="{{ url_for('static', filename='uploads/' + item.image) }}" 
                                 onerror="this.src='https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=400'" 
                                 alt="Current Image" class="img-thumbnail rounded-3 shadow-sm" style="max-height: 180px;">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="{{ url_for('wardrobe') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary-custom px-4">
                            <i class="bi bi-save me-1"></i> Update Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
